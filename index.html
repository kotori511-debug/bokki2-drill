<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簿記2級 仕訳・原価計算ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAE3CE;
    --paper-deep: #DED4B8;
    --line: #C7BA98;
    --ink: #2B2A24;
    --ink-soft: #5B5A4E;
    --navy: #263349;
    --navy-deep: #1A2436;
    --seal: #AE3428;
    --seal-deep: #8C2A20;
    --gold: #9C7F3F;
    --paper-card: #F3EDDA;
    --wrong: #6B5B95;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, transparent 0 39px, var(--line) 39px 40px),
      var(--paper);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* ---------- Header / ledger cover ---------- */
  .cover{
    background: var(--navy);
    background-image: linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#EDE6D0;
    border-radius:6px;
    padding:22px 26px 20px;
    position:relative;
    box-shadow:0 8px 22px rgba(26,36,54,0.28);
    overflow:hidden;
  }
  .cover::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:14px;
    background: repeating-linear-gradient(0deg, var(--gold) 0 2px, transparent 2px 10px);
    opacity:0.5;
  }
  .cover-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:#C9BB8D; margin-bottom:6px;
  }
  .cover-title{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:clamp(24px,5vw,32px);
    line-height:1.3;
    margin:0 0 4px;
  }
  .cover-sub{
    font-size:13px; color:#B9C1D1; margin:0;
  }
  .cover-meta{
    display:flex; gap:18px; margin-top:14px; flex-wrap:wrap;
  }
  .meta-chip{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; color:#EDE6D0;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    padding:5px 10px; border-radius:3px;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; margin-top:18px; gap:2px;
  }
  .tab{
    flex:1; text-align:center; cursor:pointer;
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-bottom:none;
    padding:11px 6px;
    font-size:13px; font-weight:700;
    color:var(--ink-soft);
    border-radius:6px 6px 0 0;
    transition:all .15s;
    letter-spacing:.02em;
  }
  .tab.active{
    background:var(--paper-card);
    color:var(--navy-deep);
    box-shadow: inset 0 3px 0 var(--seal);
  }
  .tab small{display:block;font-weight:500;font-size:10px;margin-top:2px;color:var(--ink-soft);}

  /* ---------- Main card ---------- */
  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:0 6px 6px 6px;
    padding:22px 22px 20px;
    box-shadow:0 4px 14px rgba(43,42,36,0.08);
  }

  .mode-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
  .mode-buttons{display:flex; gap:6px; flex-wrap:wrap;}
  .mode-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; padding:6px 10px; border-radius:4px;
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    cursor:pointer;
  }
  .mode-btn.active{background:var(--navy); color:#EDE6D0; border-color:var(--navy);}
  .progress-mini{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft);}

  .unit-select{
    width:100%; margin-bottom:16px; padding:9px 10px;
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:13px;
    border:1px solid var(--line); border-radius:4px; background:#fff;
    color:var(--ink);
  }

  .q-index{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold);
    letter-spacing:.1em; margin-bottom:6px;
  }
  .q-text{
    font-size:15.5px; line-height:1.8; margin:0 0 18px;
    font-weight:500; white-space:pre-line;
  }
  .choices{display:flex; flex-direction:column; gap:9px;}
  .choice{
    display:flex; align-items:flex-start; gap:10px;
    border:1px solid var(--line); background:#fff;
    border-radius:5px; padding:11px 13px;
    cursor:pointer; font-size:13.5px; text-align:left;
    transition:border-color .15s, background .15s;
    font-family:'JetBrains Mono', monospace;
    line-height:1.6;
  }
  .choice:hover{border-color:var(--gold);}
  .choice .lab{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:12px;
    width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); flex-shrink:0; color:var(--ink-soft);
    margin-top:1px;
  }
  .choice.correct{border-color:var(--seal); background:#F7ECE9;}
  .choice.correct .lab{background:var(--seal); color:#fff; border-color:var(--seal);}
  .choice.wrong{border-color:var(--wrong); background:#F1EEF7;}
  .choice.wrong .lab{background:var(--wrong); color:#fff; border-color:var(--wrong);}
  .choice[disabled]{cursor:default;}
  .choice:not(.correct):not(.wrong):disabled{opacity:.55;}

  .explain{
    margin-top:16px; padding:14px 16px;
    background:#F7F2E4; border-left:3px solid var(--gold);
    border-radius:0 4px 4px 0; font-size:13px; line-height:1.75;
    color:var(--ink-soft); display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--ink);}

  .stamp-wrap{
    position:relative; min-height:0;
  }
  .stamp{
    position:absolute; top:-6px; right:4px;
    width:74px; height:74px; border-radius:50%;
    border:3px solid var(--seal);
    color:var(--seal);
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:22px;
    transform:rotate(-14deg) scale(0);
    opacity:0;
    pointer-events:none;
    animation: stampIn .38s cubic-bezier(.2,1.4,.5,1) forwards;
  }
  .stamp.wrong{ border-color:var(--wrong); color:var(--wrong);}
  @keyframes stampIn{
    0%{transform:rotate(-14deg) scale(2.2); opacity:0;}
    60%{transform:rotate(-14deg) scale(0.92); opacity:1;}
    100%{transform:rotate(-14deg) scale(1); opacity:1;}
  }

  .next-row{ margin-top:18px; display:flex; justify-content:flex-end;}
  .next-btn{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:13px;
    background:var(--navy); color:#EDE6D0; border:none;
    padding:10px 20px; border-radius:5px; cursor:pointer;
    display:none;
  }
  .next-btn.show{display:inline-block;}
  .next-btn:hover{background:var(--navy-deep);}

  /* ---------- Flashcard mode ---------- */
  .flash{
    text-align:center; padding:10px 6px 4px;
  }
  .flash-card{
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:34px 20px; min-height:150px;
    display:flex; align-items:center; justify-content:center;
    font-size:15.5px; line-height:1.85; cursor:pointer;
    box-shadow:0 2px 8px rgba(43,42,36,0.06);
    white-space:pre-line;
  }
  .flash-card .face-a{font-weight:500;}
  .flash-card .face-b{display:none; text-align:left; font-size:13.5px; color:var(--ink-soft); white-space:normal;}
  .flash-card.flipped .face-a{display:none;}
  .flash-card.flipped .face-b{display:block;}
  .flash-hint{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold); margin-top:10px;}
  .flash-nav{display:flex; justify-content:space-between; margin-top:16px;}
  .flash-nav button{
    font-family:'JetBrains Mono', monospace; font-size:12px;
    background:transparent; border:1px solid var(--line); border-radius:5px;
    padding:8px 14px; cursor:pointer; color:var(--ink-soft);
  }
  .flash-nav button:hover{border-color:var(--gold); color:var(--ink);}

  /* ---------- Summary panel ---------- */
  .summary{
    margin-top:18px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  }
  .summary .cell{
    background:#fff; border:1px solid var(--line); border-radius:5px;
    padding:10px 6px; text-align:center;
  }
  .summary .cell b{display:block; font-family:'JetBrains Mono', monospace; font-size:17px; color:var(--navy);}
  .summary .cell span{font-size:10px; color:var(--ink-soft);}

  .review-note{
    margin-top:10px; font-size:12px; color:var(--ink-soft); text-align:center;
  }
  .footer-note{
    text-align:center; margin-top:20px; font-size:11px; color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
  }

  @media (max-width:480px){
    .summary{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="cover">
    <div class="cover-eyebrow">日商簿記2級・演習台帳</div>
    <h1 class="cover-title">仕訳・原価計算ドリル</h1>
    <p class="cover-sub">商業簿記と工業簿記、あわせて71問。実際の試験に近い仕訳・計算問題を中心に収録。</p>
    <div class="cover-meta">
      <div class="meta-chip" id="metaTotal">正答 0 / 0</div>
      <div class="meta-chip" id="metaRate">正答率 —</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-cat="商業簿記">商業簿記<small>Commercial</small></div>
    <div class="tab" data-cat="工業簿記">工業簿記<small>Cost Acc.</small></div>
  </div>

  <div class="card">
    <div class="mode-row">
      <div class="mode-buttons">
        <button class="mode-btn active" data-mode="quiz">演習モード</button>
        <button class="mode-btn" data-mode="flash">フラッシュカード</button>
        <button class="mode-btn" data-mode="review">間違い直し</button>
      </div>
      <div class="progress-mini" id="unitProgress"></div>
    </div>

    <select class="unit-select" id="unitSelect"></select>

    <!-- QUIZ MODE -->
    <div id="quizPanel">
      <div class="stamp-wrap">
        <div class="q-index" id="qIndex"></div>
        <p class="q-text" id="qText"></p>
        <div class="choices" id="choices"></div>
        <div class="explain" id="explain"></div>
        <div id="stampHost"></div>
      </div>
      <div class="next-row">
        <button class="next-btn" id="nextBtn">次の問題 →</button>
      </div>
    </div>

    <!-- FLASHCARD MODE -->
    <div id="flashPanel" style="display:none;">
      <div class="flash">
        <div class="flash-card" id="flashCard">
          <div class="face-a" id="flashFront"></div>
          <div class="face-b" id="flashBack"></div>
        </div>
        <div class="flash-hint">タップで正解・解説を表示</div>
        <div class="flash-nav">
          <button id="flashPrev">← 前へ</button>
          <span class="progress-mini" id="flashCount"></span>
          <button id="flashNext">次へ →</button>
        </div>
      </div>
    </div>

    <!-- REVIEW MODE -->
    <div id="reviewPanel" style="display:none;">
      <p class="review-note" id="reviewEmpty">まだ間違えた問題はありません。演習モードを進めましょう。</p>
    </div>

    <div class="summary" id="summary"></div>
  </div>

  <div class="footer-note">progress saved automatically — 日商簿記2級対応</div>
</div>

<script>
(function(){

const DATA = {
  "商業簿記": [
    {unit:"有価証券", q:"売買目的で保有する有価証券(帳簿価額800,000円)の期末時価が850,000円であった。決算整理仕訳として正しいものはどれか。",
     choices:["(借)有価証券 50,000 / (貸)有価証券評価益 50,000","(借)有価証券評価損 50,000 / (貸)有価証券 50,000","(借)有価証券 50,000 / (貸)受取利息 50,000","仕訳なし"],
     a:0, exp:"売買目的有価証券は時価法で評価し、値上がり益は<b>有価証券評価益</b>として当期の損益に計上します。"},
    {unit:"有価証券", q:"満期保有目的の債券について、額面金額と取得価額の差額が金利の調整と認められるとき、この差額を毎期均等額ずつ帳簿価額に加減する方法を何というか。",
     choices:["償却原価法(定額法)","低価法","時価法","洗替法"],
     a:0, exp:"金利調整差額を残存期間で按分して帳簿価額を調整するのが<b>償却原価法</b>です。満期保有目的債券に適用します。"},
    {unit:"有価証券", q:"売買目的で保有するA社株式(帳簿価額500,000円、100株、@5,000円)のうち40株を@6,000円で売却し、代金は現金で受け取った。正しい仕訳はどれか。",
     choices:[
       "(借)現金 240,000 / (貸)有価証券 200,000　有価証券売却益 40,000",
       "(借)現金 240,000 / (貸)有価証券 240,000",
       "(借)有価証券 40,000 / (貸)有価証券売却益 40,000",
       "(借)現金 200,000　有価証券売却損 40,000 / (貸)有価証券 240,000"
     ],
     a:0, exp:"帳簿単価@5,000円×40株=200,000円が売却原価。売却額40株×@6,000円=240,000円との差額40,000円が<b>有価証券売却益</b>です。"},
    {unit:"固定資産", q:"取得原価1,000,000円、残存価額0円、耐用年数8年の備品を定額法で減価償却する場合、1年あたりの減価償却費はいくらか。",
     choices:["80,000円","100,000円","125,000円","150,000円"],
     a:2, exp:"定額法の年間償却額は「取得原価÷耐用年数」= 1,000,000÷8 = <b>125,000円</b>です。"},
    {unit:"固定資産", q:"200%定率法を採用する場合の償却率の求め方として正しいものはどれか(耐用年数6年の例)。",
     choices:["1÷耐用年数(6年)","1÷耐用年数×200%(=2/6)","1÷耐用年数×150%","残存価額÷取得原価"],
     a:1, exp:"200%定率法の償却率は定額法償却率(1÷耐用年数)の2倍、すなわち<b>1/6×2=約33.3%</b>です。"},
    {unit:"固定資産", q:"取得原価1,000,000円、期首減価償却累計額600,000円の備品(間接法で記帳)を、期首に450,000円で売却し、代金は現金で受け取った。正しい仕訳はどれか。",
     choices:[
       "(借)減価償却累計額 600,000　現金 450,000 / (貸)備品 1,000,000　固定資産売却益 50,000",
       "(借)減価償却累計額 600,000　現金 400,000 / (貸)備品 1,000,000",
       "(借)現金 450,000　固定資産売却損 550,000 / (貸)備品 1,000,000",
       "(借)減価償却累計額 600,000　現金 450,000　固定資産売却損 50,000 / (貸)備品 1,000,000"
     ],
     a:0, exp:"帳簿価額=1,000,000-600,000=400,000円。売却額450,000円との差額50,000円は<b>固定資産売却益</b>です。"},
    {unit:"固定資産", q:"国庫補助金300,000円を現金で受け取り、これを機械の取得に充てた。直接減額方式による圧縮記帳の仕訳(圧縮記帳仕訳のみ)として正しいものはどれか。",
     choices:[
       "(借)固定資産圧縮損 300,000 / (貸)機械 300,000",
       "(借)機械 300,000 / (貸)固定資産圧縮損 300,000",
       "(借)国庫補助金受贈益 300,000 / (貸)機械 300,000",
       "仕訳なし"
     ],
     a:0, exp:"直接減額方式では、圧縮記帳額を<b>固定資産圧縮損</b>として費用計上し、対象資産の帳簿価額を直接減額します。"},
    {unit:"リース取引", q:"所有権移転外ファイナンス・リース取引(リース料総額600,000円、5年間毎年120,000円均等払い)について、利子込み法により契約を開始した。リース資産計上時の仕訳として正しいものはどれか。",
     choices:[
       "(借)リース資産 600,000 / (貸)リース債務 600,000",
       "(借)リース資産 120,000 / (貸)リース債務 120,000",
       "(借)リース資産 600,000 / (貸)未払金 600,000",
       "仕訳なし(支払時にのみ費用計上する)"
     ],
     a:0, exp:"利子込み法では利息相当額を区分せず、<b>リース料総額600,000円</b>をそのままリース資産・リース債務に計上します。"},
    {unit:"引当金", q:"貸倒引当金の期末残高が30,000円あり、決算で必要な見積額が45,000円であった。差額補充法による仕訳として正しいものはどれか。",
     choices:["(借)貸倒引当金繰入 15,000 / (貸)貸倒引当金 15,000","(借)貸倒引当金繰入 45,000 / (貸)貸倒引当金 45,000","(借)貸倒引当金 30,000 / (貸)貸倒引当金繰入 30,000","仕訳なし"],
     a:0, exp:"差額補充法では不足額(45,000-30,000=15,000円)だけを追加計上します。"},
    {unit:"引当金", q:"前期に発生した得意先への売掛金80,000円が得意先の倒産により貸し倒れた。貸倒引当金の残高が50,000円ある場合の仕訳として正しいものはどれか。",
     choices:[
       "(借)貸倒引当金 50,000　貸倒損失 30,000 / (貸)売掛金 80,000",
       "(借)貸倒損失 80,000 / (貸)売掛金 80,000",
       "(借)貸倒引当金 80,000 / (貸)売掛金 80,000",
       "(借)貸倒引当金繰入 80,000 / (貸)売掛金 80,000"
     ],
     a:0, exp:"引当金の範囲内は<b>貸倒引当金</b>を取り崩し、不足する30,000円は<b>貸倒損失</b>として処理します。"},
    {unit:"商品売買", q:"商品200,000円を仕入れ、代金のうち50,000円は注文時に支払った手付金(前払金)を充当し、残額は掛けとした。正しい仕訳はどれか。",
     choices:[
       "(借)仕入 200,000 / (貸)前払金 50,000　買掛金 150,000",
       "(借)仕入 200,000 / (貸)買掛金 200,000",
       "(借)仕入 150,000　前払金 50,000 / (貸)買掛金 200,000",
       "(借)前払金 50,000　買掛金 150,000 / (貸)仕入 200,000"
     ],
     a:0, exp:"事前に支払っていた<b>前払金</b>を充当額分だけ取り崩し、残額を買掛金とします。"},
    {unit:"商品売買", q:"かねて注文を受けていた商品300,000円を引き渡し、代金として送金小切手(通貨代用証券)を受け取った。正しい仕訳はどれか。",
     choices:["(借)現金 300,000 / (貸)売上 300,000","(借)当座預金 300,000 / (貸)売上 300,000","(借)受取手形 300,000 / (貸)売上 300,000","(借)前受金 300,000 / (貸)売上 300,000"],
     a:0, exp:"送金小切手は通貨代用証券として<b>現金</b>勘定で処理します。"},
    {unit:"商品売買", q:"商品400,000円を売り上げ、代金のうち300,000円については取引銀行で荷為替を取り組み(手取金は当座預金に入金)、残額は掛けとした。正しい仕訳はどれか。",
     choices:[
       "(借)当座預金 300,000　売掛金 100,000 / (貸)売上 400,000",

     choices:["安全余裕率","損益分岐点比率","限界利益率","変動費率"],

    {unit:"本社工場会計", q:"本社工場会計において、工場が本社から材料代金の送金を受けた場合、工場側の仕訳の貸方科目はどれか。",
     choices:["本社","工場","買掛金","現金のみ(相手科目なし)"],
     a:0, exp:"本社・工場間の内部取引は、工場側では<b>本社</b>勘定、本社側では工場勘定を用いて処理します。"},
    {unit:"本社工場会計", q:"本社が一括して記帳している建物の減価償却費50,000円のうち、工場設備分を工場の製造間接費に振り替える。工場側の仕訳として正しいものはどれか。",
     choices:["(借)製造間接費 50,000 / (貸)本社 50,000","(借)本社 50,000 / (貸)製造間接費 50,000","(借)減価償却費 50,000 / (貸)本社 50,000","(借)製造間接費 50,000 / (貸)減価償却累計額 50,000"],
     a:0, exp:"工場側で発生した費用として<b>製造間接費</b>を借方に計上し、相手科目は本社との内部取引を示す<b>本社</b>勘定とします。"}
  ]
};

const STORE_KEY = "bokki2_progress_v2";
let progress = {}; // { "商業簿記|0": {correct:bool, seen:bool}, ... }
let state = { cat:"商業簿記", mode:"quiz", unitFilter:"__all__", qIdx:0, order:[], answered:false, flashIdx:0 };

function qid(cat, idx){ return cat + "|" + idx; }

// Uses the browser's own localStorage so progress survives closing the app/tab.
// (Falls back to an in-memory object if storage is unavailable, e.g. private browsing.)
async function loadProgress(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    progress = raw ? JSON.parse(raw) : {};
  }catch(e){ progress = {}; }
}
async function saveProgress(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){}
}

function currentList(){
  const all = DATA[state.cat];
  if(state.unitFilter === "__all__") return all.map((q,i)=>({...q, idx:i}));
  return all.map((q,i)=>({...q, idx:i})).filter(q=>q.unit===state.unitFilter);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// Returns a copy of the question with its choice order (and correct index) randomized,
// so the correct answer position varies each time and can't be guessed by position.
function shuffledChoiceCopy(q){
  const order = shuffle(q.choices.map((c,i)=>i));
  const newChoices = order.map(i=>q.choices[i]);
  const newA = order.indexOf(q.a);
  return {...q, choices:newChoices, a:newA};
}

function populateUnitSelect(){
  const sel = document.getElementById('unitSelect');
  const units = [...new Set(DATA[state.cat].map(q=>q.unit))];
  sel.innerHTML = '<option value="__all__">すべての単元（' + DATA[state.cat].length + '問）</option>' +
    units.map(u=>`<option value="${u}">${u}（${DATA[state.cat].filter(q=>q.unit===u).length}問）</option>`).join('');
  sel.value = state.unitFilter;
}

function renderMeta(){
  const cats = Object.keys(DATA);
  let correct=0, total=0;
  cats.forEach(cat=>{
    DATA[cat].forEach((q,i)=>{
      const p = progress[qid(cat,i)];
      if(p && p.seen){ total++; if(p.correct) correct++; }
    });
  });
  document.getElementById('metaTotal').textContent = `正答 ${correct} / ${total}`;
  document.getElementById('metaRate').textContent = total ? `正答率 ${Math.round(correct/total*100)}%` : '正答率 —';
}

function renderSummary(){
  const list = currentList();
  let seen=0, correct=0;
  list.forEach(q=>{ const p = progress[qid(state.cat,q.idx)]; if(p && p.seen){ seen++; if(p.correct) correct++; } });
  const wrongCount = list.filter(q=>{ const p=progress[qid(state.cat,q.idx)]; return p && p.seen && !p.correct; }).length;
  document.getElementById('summary').innerHTML = `
    <div class="cell"><b>${list.length}</b><span>この単元の問題数</span></div>
    <div class="cell"><b>${seen}</b><span>解答済み</span></div>
    <div class="cell"><b>${correct}</b><span>正解</span></div>
    <div class="cell"><b>${wrongCount}</b><span>要復習</span></div>`;
  renderMeta();
}

/* ---------------- QUIZ MODE ---------------- */
function startQuiz(){
  state.order = shuffle(currentList()).map(shuffledChoiceCopy);
  state.qIdx = 0;
  state.answered = false;
  renderQuiz();
}

function renderQuiz(){
  const list = state.order;
  document.getElementById('unitProgress').textContent = list.length ? `${state.qIdx+1} / ${list.length} 問` : '';
  if(!list.length){
    document.getElementById('qText').textContent = "この単元には問題がありません。";
    document.getElementById('choices').innerHTML = "";
    document.getElementById('explain').classList.remove('show');
    document.getElementById('nextBtn').classList.remove('show');
    return;
  }
  const q = list[state.qIdx];
  state.answered = false;
  document.getElementById('qIndex').textContent = `${state.cat} ／ ${q.unit}`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('explain').classList.remove('show');
  document.getElementById('explain').innerHTML = "";
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('stampHost').innerHTML = "";

  const labels = ['ア','イ','ウ','エ'];
  const box = document.getElementById('choices');
  box.innerHTML = "";
  q.choices.forEach((c, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="lab">${labels[i]}</span><span>${c}</span>`;
    btn.onclick = ()=> answerQuiz(q, i, btn);
    box.appendChild(btn);
  });
}

async function answerQuiz(q, chosenIdx, btnEl){
  if(state.answered) return;
  state.answered = true;
  const correct = chosenIdx === q.a;
  const buttons = document.querySelectorAll('#choices .choice');
  buttons.forEach((b,i)=>{
    b.disabled = true;
    if(i === q.a) b.classList.add('correct');
    if(i === chosenIdx && !correct) b.classList.add('wrong');
  });
  const exp = document.getElementById('explain');
  exp.innerHTML = q.exp;
  exp.classList.add('show');
  document.getElementById('nextBtn').classList.add('show');

  const stampHost = document.getElementById('stampHost');
  stampHost.innerHTML = `<div class="stamp ${correct? '' : 'wrong'}">${correct ? '正' : '否'}</div>`;

  progress[qid(state.cat, q.idx)] = { correct, seen:true };
  await saveProgress();
  renderSummary();
}

document.getElementById('nextBtn').onclick = ()=>{
  if(state.qIdx < state.order.length - 1){
    state.qIdx++;
    renderQuiz();
  }else{
    state.order = shuffle(currentList()).map(shuffledChoiceCopy);
    state.qIdx = 0;
    renderQuiz();
  }
};

/* ---------------- FLASHCARD MODE ---------------- */
function startFlash(){
  state.flashIdx = 0;
  renderFlash();
}
function renderFlash(){
  const list = currentList();
  document.getElementById('flashCount').textContent = list.length ? `${state.flashIdx+1} / ${list.length}` : '';
  const card = document.getElementById('flashCard');
  card.classList.remove('flipped');
  if(!list.length){
    document.getElementById('flashFront').textContent = "この単元には問題がありません。";
    document.getElementById('flashBack').innerHTML = "";
    return;
  }
  const q = list[state.flashIdx];
  document.getElementById('flashFront').textContent = q.q;
  document.getElementById('flashBack').innerHTML =
    `<div style="margin-bottom:8px;font-family:'JetBrains Mono',monospace;"><b>正解：${q.choices[q.a]}</b></div><div>${q.exp}</div>`;
}
document.getElementById('flashCard').onclick = ()=>{
  document.getElementById('flashCard').classList.toggle('flipped');
};
document.getElementById('flashPrev').onclick = ()=>{
  const list = currentList();
  if(!list.length) return;
  state.flashIdx = (state.flashIdx - 1 + list.length) % list.length;
  renderFlash();
};
document.getElementById('flashNext').onclick = ()=>{
  const list = currentList();
  if(!list.length) return;
  state.flashIdx = (state.flashIdx + 1) % list.length;
  renderFlash();
};

/* ---------------- REVIEW MODE ---------------- */
function renderReview(){
  const list = currentList().filter(q=>{
    const p = progress[qid(state.cat, q.idx)];
    return p && p.seen && !p.correct;
  });
  const panel = document.getElementById('reviewPanel');
  if(!list.length){
    panel.innerHTML = `<p class="review-note">まだ間違えた問題はありません。演習モードを進めましょう。</p>`;
    return;
  }
  panel.innerHTML = list.map(q=>`
    <div style="background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);margin-bottom:6px;">${q.unit}</div>
      <div style="font-size:14px;margin-bottom:8px;line-height:1.75;white-space:pre-line;">${q.q}</div>
      <div style="font-size:13px;color:var(--seal-deep);margin-bottom:6px;font-family:'JetBrains Mono',monospace;"><b>正解：${q.choices[q.a]}</b></div>
      <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.7;">${q.exp}</div>
    </div>
  `).join('');
}

/* ---------------- Navigation wiring ---------------- */
function switchMode(mode){
  state.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(b=> b.classList.toggle('active', b.dataset.mode===mode));
  document.getElementById('quizPanel').style.display = mode==='quiz' ? 'block' : 'none';
  document.getElementById('flashPanel').style.display = mode==='flash' ? 'block' : 'none';
  document.getElementById('reviewPanel').style.display = mode==='review' ? 'block' : 'none';
  if(mode==='quiz') startQuiz();
  if(mode==='flash') startFlash();
  if(mode==='review') renderReview();
  renderSummary();
}

document.querySelectorAll('.mode-btn').forEach(b=>{
  b.onclick = ()=> switchMode(b.dataset.mode);
});
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    state.cat = t.dataset.cat;
    state.unitFilter = "__all__";
    populateUnitSelect();
    switchMode(state.mode);
  };
});
document.getElementById('unitSelect').onchange = (e)=>{
  state.unitFilter = e.target.value;
  switchMode(state.mode);
};

(async function init(){
  await loadProgress();
  populateUnitSelect();
  switchMode('quiz');
})();

})();
</script>
